<!DOCTYPE html>
<html lang="pl-PL">
<head>
    <meta charset="utf-8">
    <title>Formularz rejestracji - Alan Szymkowicz</title>
</head>
<body bgcolor="#FAF0E6">
    <h1>FORMULARZ REJESTRACJI DO TURNIEJU GAMINGOWEGO</h1>
    
    <form action="#" method="post">
        <fieldset>
            <legend>Dane osobowe</legend>
            <p>
                <label>Imię: <input type="text" name="imie"></label>
            </p>
            <p>
                <label>Nazwisko: <input type="text" name="nazwisko"></label>
            </p>
            <p>
                <label>Nick: <input type="text" name="nick"></label>
            </p>
            <p>
                <label>E-mail: <input type="email" name="email"></label>
            </p>
            <p>
                <label>Nr. tel.: <input type="tel" name="tel"></label>
            </p>
            <p>
                <label>Hasło: <input type="password" name="haslo"></label>
            </p>
        </fieldset>

        <fieldset>
            <legend>Gatunek</legend>
            <p>
                <label><input type="checkbox" name="gatunek" value="fps"> FPS</label><br>
                <label><input type="checkbox" name="gatunek" value="wyscigi"> Wyścigi</label><br>
                <label><input type="checkbox" name="gatunek" value="strategiczne"> Strategiczne</label>
            </p>
        </fieldset>

        <fieldset>
            <legend>Pora gry</legend>
            <p>
                <label><input type="checkbox" name="pora" value="rano" checked> Rano</label><br>
                <label><input type="checkbox" name="pora" value="poludnie"> Południe</label><br>
                <label><input type="checkbox" name="pora" value="popoludnie"> Popołudnie</label><br>
                <label><input type="checkbox" name="pora" value="wieczor"> Wieczór</label><br>
                <label><input type="checkbox" name="pora" value="noc"> Noc</label>
            </p>
        </fieldset>

        <fieldset>
            <legend>Sprzęt</legend>
            <p>
                <label><input type="checkbox" name="sprzet" value="komputer"> Komputer</label><br>
                <label><input type="checkbox" name="sprzet" value="laptop"> Laptop</label><br>
                <label><input type="checkbox" name="sprzet" value="konsola"> Konsola</label><br>
                <label><input type="checkbox" name="sprzet" value="telefon"> Telefon</label>
            </p>
        </fieldset>

        <fieldset>
            <legend>Dodatkowe opcje</legend>
            <p>
                <label><input type="checkbox" name="opcje" value="mam_druzyne"> Mam drużynę</label><br>
                <label><input type="checkbox" name="opcje" value="szukam_druzyny"> Szukam drużyny</label><br>
                <label><input type="checkbox" name="opcje" value="gram_solo"> Gram solo</label>
            </p>
        </fieldset>

        <fieldset>
            <legend>Wybór gry</legend>
            <p>
                <label>GRA: 
                    <select name="gra">
                        <option value="cs2" selected>CS2</option>
                        <option value="lol">LoL</option>
                        <option value="val">Valorant</option>
                    </select>
                </label>
            </p>
            <p>
                <label>PLATFORMA: 
                    <select name="platforma">
                        <option value="" disabled selected>WYBIERZ</option>
                        <option value="pc">PC</option>
                        <option value="konsola">Konsola</option>
                        <option value="mobilna">Mobilna</option>
                    </select>
                </label>
            </p>
            <p>
                <label>POZIOM UMIEJĘTNOŚCI: 
                    <select name="poziom">
                        <option value="sredni" selected>Średni</option>
                        <option value="poczatkujacy">Początkujący</option>
                        <option value="zaawansowany">Zaawansowany</option>
                    </select>
                </label>
            </p>
        </fieldset>

        <fieldset>
            <legend>Zgody</legend>
            <p>
                <label><input type="checkbox" name="zgody" value="regulamin"> REGULAMIN</label>
                <label><input type="checkbox" name="zgody" value="zasady"> ZASADY</label><br>
                <label><input type="checkbox" name="zgody" value="fair_play"> FAIR PLAY</label>
                <label><input type="checkbox" name="zgody" value="kontakt"> KONTAKT</label>
            </p>
        </fieldset>

        <fieldset>
            <legend>Tryb</legend>
            <p>
                <label><input type="radio" name="tryb" value="solo" checked> SOLO</label><br>
                <label><input type="radio" name="tryb" value="duety"> DUETY</label><br>
                <label><input type="radio" name="tryb" value="trio"> TRIO</label><br>
                <label><input type="radio" name="tryb" value="druzyna"> DRUŻYNA</label>
            </p>
        </fieldset>

        <fieldset>
            <legend>Dodatkowe informacje</legend>
            <p>
                <textarea name="info" rows="4" cols="40" placeholder="Napisz coś o sobie i doświadczeniu w grach"></textarea>
            </p>
        </fieldset>

        <p>
            <input type="submit" value="WYŚLIJ">
            <input type="reset" value="CZYŚĆ">
        </p>
    </form>

    <br>
    <p><a href="index.html">Wróć do strony głównej</a></p>
</body>
</html>
